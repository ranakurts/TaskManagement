<div class="dashboard-layout">
  <!-- 🌌 Derin Uzay Simülasyonu Canvas Katmanı -->
  <canvas id="spaceCanvas" class="space-canvas"></canvas>

  <!-- Üst Bar / Header -->
  <header class="dashboard-top-nav">
    <div class="brand-group">
      <h1 class="app-brand-title" data-text="RanaCore">RanaCore</h1>
      <span class="app-brand-subtitle">SMART WORKSPACE</span>
    </div>
    
    <nav class="nav-menu">
      <a routerLink="/dashboard" class="nav-item active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
      <a routerLink="/tasks" class="nav-item"><i class="fa-solid fa-list-check"></i> My Tasks</a>
      <a routerLink="/board" class="nav-item"><i class="fa-solid fa-columns"></i> Board</a>
      <a routerLink="/calendar" class="nav-item"><i class="fa-regular fa-calendar-days"></i> Calendar</a>
      <a routerLink="/workspaces" class="nav-item"><i class="fa-solid fa-folder-open"></i> Workspaces</a>
      <a routerLink="/settings" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>

    <div class="user-actions">
      <button class="logout-btn" routerLink="/login"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </header>

  <!-- Ana İçerik Alanı -->
  <main class="dashboard-main-content">
    <div class="welcome-section">
      <div class="welcome-text">
        <h2 class="dashboard-main-title">Dashboard</h2>
        <p class="dashboard-hero-subtitle">Build faster. Organize smarter.</p>
      </div>
      <div class="quick-actions">
        <button class="btn-primary-glow" routerLink="/board"><i class="fa-solid fa-bell"></i> Open Board</button>
      </div>
    </div>

    <!-- İstatistik Kartları Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-list-check"></i></div>
        <div class="stat-info">
          <h3>Total Tasks</h3>
          <p class="stat-value">0</p>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon active-icon"><i class="fa-solid fa-clock"></i></div>
        <div class="stat-info">
          <h3>Active</h3>
          <p class="stat-value">0</p>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon completed-icon"><i class="fa-solid fa-circle-check"></i></div>
        <div class="stat-info">
          <h3>Completed</h3>
          <p class="stat-value">0</p>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon completion-icon"><i class="fa-solid fa-chart-line"></i></div>
        <div class="stat-info">
          <h3>Completion</h3>
          <p class="stat-value">0%</p>
        </div>
      </div>
    </div>

    <!-- Grafik ve Dağılım Alanı -->
    <div class="dashboard-lower-grid">
      <div class="dashboard-card task-dist-card">
        <h3>Task Distribution</h3>
        <p class="card-sub">This Month</p>
        <div class="dist-chart-placeholder">
          <div class="legend-item"><span class="dot completed-dot"></span> Completed</div>
          <div class="legend-item"><span class="dot active-dot"></span> Active</div>
        </div>
      </div>

      <div class="dashboard-card productivity-card">
        <h3>Weekly Productivity</h3>
        <p class="card-sub">Last 7 Days</p>
        <div class="productivity-chart-placeholder">
          <div class="chart-bar" style="height: 40%;"></div>
          <div class="chart-bar" style="height: 70%;"></div>
          <div class="chart-bar" style="height: 50%;"></div>
          <div class="chart-bar" style="height: 90%;"></div>
          <div class="chart-bar" style="height: 60%;"></div>
          <div class="chart-bar" style="height: 80%;"></div>
          <div class="chart-bar" style="height: 100%;"></div>
        </div>
      </div>
    </div>
  </main>
</div>
